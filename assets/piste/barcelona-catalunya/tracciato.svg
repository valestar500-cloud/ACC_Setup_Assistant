     Parametri: dur = secondi per un giro, repeatCount = numero di giri, begin = attesa prima di partire.
     Il dur dell'elemento set deve essere dur x repeatCount. r = raggio del pallino e dell'alone (in unità del disegno). -->
<g class="pallino" opacity="0">
  <set attributeName="opacity" to="1" begin="0.9s" dur="13.2s"/>
  <circle r="25.62" fill="#fff" opacity=".45" filter="url(#alone)"><animateMotion dur="4.4s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
  <circle r="15.38" fill="#fff"><animateMotion dur="4.4s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
</g>
