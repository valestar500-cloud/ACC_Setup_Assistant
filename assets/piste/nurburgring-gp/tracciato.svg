  <set attributeName="opacity" to="1" begin="0.9s" dur="16.8s"/>
  <circle r="5.11" fill="#fff" opacity=".45" filter="url(#alone)"><animateMotion dur="5.6s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
  <circle r="3.06" fill="#fff"><animateMotion dur="5.6s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
</g>
</svg>
