  <circle r="5.12" fill="#fff" opacity=".45" filter="url(#alone)"><animateMotion dur="3.3s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
  <circle r="3.07" fill="#fff"><animateMotion dur="3.3s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
</g>
