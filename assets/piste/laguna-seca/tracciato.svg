  <circle r="5.13" fill="#fff" opacity=".45" filter="url(#alone)"><animateMotion dur="4.7s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
