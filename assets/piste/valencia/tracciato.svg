  <set attributeName="opacity" to="1" begin="0.9s" dur="21.0s"/>
  <circle r="5.08" fill="#fff" opacity=".45" filter="url(#alone)"><animateMotion dur="7.0s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
  <circle r="3.05" fill="#fff"><animateMotion dur="7.0s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
</g>
