  <circle r="5.08" fill="#fff" opacity=".45" filter="url(#alone)"><animateMotion dur="6.9s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
