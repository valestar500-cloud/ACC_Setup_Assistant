<!-- Pallino che percorre il tracciato in senso orario.
     Parametri: dur = secondi per un giro, repeatCount = numero di giri, begin = attesa prima di partire.
     Il dur dell'elemento set deve essere dur x repeatCount. r = raggio del pallino e dell'alone (in unità del disegno). -->
<g class="pallino" opacity="0">
  <set attributeName="opacity" to="1" begin="0.9s" dur="16.5s"/>
  <circle r="5.12" fill="#fff" opacity=".45" filter="url(#alone)"><animateMotion dur="5.5s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
  <circle r="3.07" fill="#fff"><animateMotion dur="5.5s" repeatCount="3" begin="0.9s" calcMode="linear"><mpath href="#percorso" xlink:href="#percorso"/></animateMotion></circle>
</g>
</svg>
